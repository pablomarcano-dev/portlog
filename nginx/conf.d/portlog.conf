upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:80;
}

# Port 80 exists only to answer ACME challenges and bounce everything else to
# HTTPS. If you are reading this because nginx will not start, see the note on
# ssl_certificate below before reverting.
server {
    listen 80;
    server_name 167.233.48.84.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` was deprecated in nginx 1.25; the image tracks current
    # stable, so use the standalone directive and keep the logs warning-free.
    listen 443 ssl;
    http2 on;
    server_name 167.233.48.84.sslip.io;

    # nginx REFUSES TO START if either of these files is missing — it does not
    # degrade to HTTP, it exits, and the whole site goes down with it. Confirm
    # the certs exist on the box before deploying a change to this block:
    #   docker compose run --rm certbot certificates
    ssl_certificate /etc/letsencrypt/live/167.233.48.84.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/167.233.48.84.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Load-bearing for email attachments: nginx defaults to 1m, which rejects
    # anything larger with a 413 before the request ever reaches the backend.
    # MAX_ATTACHMENT_SIZE_BYTES in @portlog/schemas is the real limit; this only
    # has to be comfortably above it.
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }
}
