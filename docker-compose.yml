services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - '80'
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      # Operating timezone of the agency (Venezuela, UTC-4). LOAD-BEARING — do not remove.
      # Notice/SOF/NOR formatters print dates via the process-local getHours()/getDate(),
      # so an unset TZ makes the container run in UTC and shifts every generated document
      # by +4h (16:00 renders as "20:00 hrs LT"), sometimes across midnight. Also baked
      # into backend/Dockerfile; repeated here so it is visible at the deploy surface.
      # Note: postgres deliberately stays on UTC — the DB stores absolute instants and
      # only the rendering layer is localised.
      TZ: America/Caracas
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/portlog
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - '5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portlog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    # expose, not ports: both the S3 API (9000) and the admin console (9001) stay
    # on the compose network. Publishing them put a login page for the bucket
    # holding every issued PEDR/SOF/NOR on the public internet, guarded only by
    # MINIO_ROOT_PASSWORD — and write access there means a document can be
    # silently replaced after issue.
    # The backend reaches this at minio:9000 via MINIO_ENDPOINT; downloads are
    # streamed through GET /api/attachments/:id/download, so nothing outside this
    # network ever needs either port.
    # To reach the console for admin work: ssh -L 9001:minio:9001 portlog-prod
    expose:
      - '9000'
      - '9001'
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
