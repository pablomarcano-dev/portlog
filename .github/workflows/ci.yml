name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the checked-out code. Anything a
# compromised action pulls in therefore cannot write to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      two-factor-db:
        image: postgres:16
        env:
          POSTGRES_USER: portlog_test
          POSTGRES_PASSWORD: isolated-ci-test-only
          POSTGRES_DB: portlog_two_factor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portlog_test -d portlog_two_factor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build schemas
        run: npm run build -w @portlog/schemas

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations to the isolated two-factor database
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://portlog_test:isolated-ci-test-only@127.0.0.1:5432/portlog_two_factor_test

      - name: Test
        run: npm run test --workspaces --if-present
        env:
          TEST_TWO_FACTOR_DATABASE_URL: postgresql://portlog_test:isolated-ci-test-only@127.0.0.1:5432/portlog_two_factor_test
