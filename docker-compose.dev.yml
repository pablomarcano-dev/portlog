# Local infrastructure only — the backend and frontend run on the host via `npm run dev`.
#
# TIMEZONE (load-bearing): the backend must run with TZ=America/Caracas, matching the
# `TZ` set on the backend service in docker-compose.yml. Notice/SOF/NOR formatters print
# dates with the process-local getHours()/getDate(), so a backend running on the
# developer's own timezone renders every document at the wrong hour — and renders it
# *differently wrong* from production, which is how this class of bug survives review.
#
# Because the dev backend is a host process, this file cannot set it for you. Put
#
#     TZ=America/Caracas
#
# in `backend/.env` (NestJS ConfigModule loads it and Node applies TZ changes retroactively),
# or export it in your shell before `npm run dev`. Verify with:
#
#     node -e 'console.log(new Date("2026-07-05T20:00:00Z").getHours())'   # must print 16
#
# The containers below deliberately stay on UTC: Postgres stores absolute instants and
# only the rendering layer is localised, so shifting the DB clock would help nothing and
# would make dev disagree with production.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: portlog
      POSTGRES_PASSWORD: portlog_dev
      POSTGRES_DB: portlog
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portlog']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-portlog}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-portlog_dev}
    volumes:
      - minio-dev-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-portlog} $${MINIO_ROOT_PASSWORD:-portlog_dev};
        mc mb --ignore-existing local/sgc-documents;
        exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025' # SMTP — NestJS sends here in dev
      - '8025:8025' # Web UI — http://localhost:8025
    restart: unless-stopped

volumes:
  postgres-dev-data:
  minio-dev-data:
